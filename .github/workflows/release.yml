name: Build & Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"

      - name: Cache Flutter packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Build APKs (release)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk mark-arm64.apk
          mv app-armeabi-v7a-release.apk mark-armeabi-v7a.apk
          mv app-x86_64-release.apk mark-x86_64.apk
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/mark-arm64.apk
            build/app/outputs/flutter-apk/mark-armeabi-v7a.apk
            build/app/outputs/flutter-apk/mark-x86_64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

      # 12. Deploy APKs to public repo (Mark_v3_downloads)
      - name: Deploy APKs to public downloads repo
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git clone --depth 1 https://github.com/JosueAlejandro13/Mark_v3_downloads.git temp_repo
          cd temp_repo
          git checkout gh-pages || git checkout --orphan gh-pages
          cp ../build/app/outputs/flutter-apk/*.apk .
          git add .
          git commit -m "Update APKs for $GITHUB_REF_NAME" || echo "No changes"
          git push https://x-access-token:${{ secrets.DEPLOY_TOKEN }}@github.com/JosueAlejandro13/Mark_v3_downloads.git gh-pages
